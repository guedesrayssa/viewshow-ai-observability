[project]
name = "argus-dump-explorer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "ipykernel>=6,<7",
  "jupyterlab>=4,<5",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "PyMySQL>=1.1,<2",
  "python-dotenv>=1,<2",
  "SQLAlchemy>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the isolated argus_test MySQL database"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
