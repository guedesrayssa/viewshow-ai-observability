<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1600" viewBox="0 0 2600 1600" role="img" aria-labelledby="title description">
  <title id="title">Diagrama de implantação alvo do View Show com Amazon EKS</title>
  <desc id="description">Arquitetura AWS com Amplify, API Gateway, Application Load Balancer, VPC em duas zonas de disponibilidade, pods Amazon EKS Fargate em sub-redes privadas e serviços AWS gerenciados.</desc>
  <defs>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#111827}.subtitle{font:18px Arial,sans-serif;fill:#475569}.section{font:700 21px Arial,sans-serif;fill:#1f2937}.zone{font:700 18px Arial,sans-serif;fill:#0f766e}.subnet{font:700 16px Arial,sans-serif;fill:#4d7c0f}.private{font:700 16px Arial,sans-serif;fill:#0369a1}.box-title{font:700 16px Arial,sans-serif;fill:#111827;text-anchor:middle}.box-sub{font:italic 13px Arial,sans-serif;fill:#334155;text-anchor:middle}.small{font:13px Arial,sans-serif;fill:#475569}.label{font:13px Arial,sans-serif;fill:#334155}.legend{font:14px Arial,sans-serif;fill:#374151}.white{font:700 18px Arial,sans-serif;fill:#fff;text-anchor:middle}.icon{font:700 14px Arial,sans-serif;fill:#fff;text-anchor:middle}.aws-boundary{fill:#fff;stroke:#111827;stroke-width:3}.vpc{fill:#fcfbff;stroke:#8c4fff;stroke-width:3}.az{fill:#faffff;stroke:#14b8a6;stroke-width:2;stroke-dasharray:8 7}.pub{fill:#f6faea;stroke:#70a643;stroke-width:2}.priv{fill:#eef9fb;stroke:#0ea5b7;stroke-width:2}.managed{fill:#fff;stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7}.node{fill:#fff;stroke:#334155;stroke-width:1.7}.purple{fill:#f5f0ff;stroke:#7c3aed;stroke-width:2}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.pink{fill:#fdf2f8;stroke:#db2777;stroke-width:2}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.cyan{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.gray{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.flow{fill:none;stroke:#111827;stroke-width:3;marker-end:url(#arrowBlack)}.identity{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrowBlue)}.data{fill:none;stroke:#059669;stroke-width:3;marker-end:url(#arrowGreen)}.async{fill:none;stroke:#d946ef;stroke-width:3;marker-end:url(#arrowPink)}.observe{fill:none;stroke:#ea580c;stroke-width:3;marker-end:url(#arrowOrange)}.control{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrowGray)}.controller{fill:none;stroke:#7c3aed;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrowPurple)}
    </style>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#111827"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#d946ef"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#ea580c"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/></marker>
  </defs>

  <rect width="2600" height="1600" fill="#ffffff"/>
  <text x="50" y="58" class="title">Implantação-alvo do View Show — Amazon EKS</text>
  <text x="50" y="90" class="subtitle">Entrada HTTPS • frontend público • workloads privados em duas AZs • Kubernetes sobre EKS Fargate</text>
  <rect x="300" y="130" width="2240" height="1360" rx="0" class="aws-boundary"/>
  <rect x="278" y="148" width="44" height="34" rx="5" fill="#1f2937"/>
  <text x="300" y="172" class="white">AWS</text>
  <text x="340" y="171" class="section">AWS Cloud — Região us-east-1</text>

  <!-- External actors -->
  <circle cx="105" cy="300" r="28" fill="none" stroke="#111827" stroke-width="3"/>
  <path d="M58 385 C60 335 150 335 152 385 M75 355 L135 355" fill="none" stroke="#111827" stroke-width="3"/>
  <text x="105" y="410" class="box-title">Usuário</text><text x="105" y="430" class="box-sub">Dashboard</text>
  <rect x="42" y="570" width="126" height="82" rx="8" class="blue"/><rect x="54" y="582" width="38" height="38" rx="4" fill="#2563eb"/><text x="73" y="607" class="icon">SSO</text>
  <text x="115" y="601" class="box-title">Grupo Globo</text><text x="115" y="622" class="box-sub">OIDC ou SAML</text>
  <rect x="42" y="1110" width="126" height="82" rx="8" class="gray"/><rect x="54" y="1122" width="38" height="38" rx="4" fill="#64748b"/><text x="73" y="1147" class="icon">AR</text>
  <text x="105" y="1142" class="box-title">Sistema ARGUS</text><text x="105" y="1163" class="box-sub">origem operacional</text>

  <!-- Public AWS entry -->
  <g transform="translate(390,230)"><rect width="150" height="92" rx="8" class="pink"/><rect x="14" y="16" width="47" height="47" rx="5" fill="#db2777"/><text x="37" y="46" class="icon">AMP</text><text x="105" y="42" class="box-title">AWS Amplify</text><text x="105" y="64" class="box-sub">frontend Next.js</text></g>
  <g transform="translate(590,230)"><rect width="150" height="92" rx="8" class="purple"/><rect x="14" y="16" width="47" height="47" rx="5" fill="#7c3aed"/><text x="37" y="46" class="icon">API</text><text x="105" y="42" class="box-title">API Gateway</text><text x="105" y="64" class="box-sub">proxy same-origin</text></g>

  <!-- VPC and AZs -->
  <rect x="770" y="360" width="1060" height="1015" rx="8" class="vpc"/>
  <text x="1300" y="395" class="section" text-anchor="middle" fill="#6d28d9">VPC dedicada — duas Zonas de Disponibilidade</text>
  <rect x="795" y="420" width="485" height="910" rx="6" class="az"/>
  <text x="820" y="450" class="zone">AZ us-east-1a</text>
  <rect x="1320" y="420" width="485" height="910" rx="6" class="az"/>
  <text x="1345" y="450" class="zone">AZ us-east-1b</text>
  <rect x="815" y="470" width="445" height="215" rx="5" class="pub"/>
  <text x="835" y="498" class="subnet">Sub-rede pública</text>
  <rect x="1340" y="470" width="445" height="215" rx="5" class="pub"/>
  <text x="1360" y="498" class="subnet">Sub-rede pública</text>
  <rect x="815" y="725" width="445" height="580" rx="5" class="priv"/>
  <text x="835" y="754" class="private">Sub-rede privada — perfil Fargate AZ-a</text>
  <rect x="1340" y="725" width="445" height="580" rx="5" class="priv"/>
  <text x="1360" y="754" class="private">Sub-rede privada — perfil Fargate AZ-b</text>

  <!-- Load balancer and network components -->
  <rect x="1030" y="525" width="535" height="112" rx="8" class="purple"/>
  <rect x="1050" y="545" width="52" height="52" rx="6" fill="#7c3aed"/><text x="1076" y="578" class="icon">ALB</text>
  <text x="1300" y="567" class="box-title">Application Load Balancer</text><text x="1300" y="590" class="box-sub">duas AZs • target IP • health check /health</text>
  <g transform="translate(860,545)"><circle cx="38" cy="35" r="29" fill="#7c3aed"/><text x="38" y="41" class="icon">NAT</text><text x="38" y="82" class="box-title">NAT Gateway</text></g>
  <g transform="translate(1655,545)"><circle cx="38" cy="35" r="29" fill="#7c3aed"/><text x="38" y="41" class="icon">NAT</text><text x="38" y="82" class="box-title">NAT Gateway</text></g>
  <rect x="900" y="635" width="155" height="34" rx="4" class="gray"/><text x="978" y="657" class="small" text-anchor="middle">Internet Gateway</text>

  <!-- EKS control plane -->
  <rect x="1970" y="230" width="505" height="150" rx="8" class="managed"/>
  <text x="1995" y="260" class="section">Serviços gerenciados da AWS</text>
  <rect x="2000" y="282" width="210" height="74" rx="7" class="purple"/><rect x="2014" y="296" width="36" height="36" rx="4" fill="#7c3aed"/><text x="2032" y="320" class="icon">EKS</text><text x="2135" y="311" class="box-title">Amazon EKS</text><text x="2135" y="332" class="box-sub">control plane gerenciado</text>
  <rect x="2240" y="282" width="210" height="74" rx="7" class="blue"/><rect x="2254" y="296" width="36" height="36" rx="4" fill="#2563eb"/><text x="2272" y="320" class="icon">ID</text><text x="2375" y="311" class="box-title">Amazon Cognito</text><text x="2375" y="332" class="box-sub">identidade e federação</text>

  <!-- Kubernetes resources -->
  <rect x="850" y="780" width="900" height="480" rx="8" fill="#fbfaff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="875" y="812" class="section" fill="#6d28d9">Cluster Kubernetes — namespace view-show</text>
  <rect x="1110" y="835" width="330" height="70" rx="7" class="purple"/><text x="1275" y="864" class="box-title">Ingress + AWS Load Balancer Controller</text><text x="1275" y="886" class="box-sub">reconcilia ALB e targets IP</text>
  <rect x="1128" y="930" width="294" height="62" rx="7" class="cyan"/><text x="1275" y="956" class="box-title">Service API — ClusterIP</text><text x="1275" y="977" class="box-sub">descobre endpoints dos Pods</text>
  <g transform="translate(875,1025)"><rect width="290" height="120" rx="8" class="orange"/><rect x="18" y="20" width="48" height="48" rx="5" fill="#ea580c"/><text x="42" y="51" class="icon">POD</text><text x="175" y="48" class="box-title">API Deployment</text><text x="175" y="70" class="box-sub">réplica A • Pod Fargate</text><text x="175" y="96" class="box-sub">HPA: mínimo 2, máximo 4</text></g>
  <g transform="translate(1435,1025)"><rect width="290" height="120" rx="8" class="orange"/><rect x="18" y="20" width="48" height="48" rx="5" fill="#ea580c"/><text x="42" y="51" class="icon">POD</text><text x="175" y="48" class="box-title">API Deployment</text><text x="175" y="70" class="box-sub">réplica B • Pod Fargate</text><text x="175" y="96" class="box-sub">HPA: mínimo 2, máximo 4</text></g>
  <g transform="translate(875,1165)"><rect width="290" height="70" rx="8" class="orange"/><text x="145" y="1193" class="box-title">CronJob de ingestão</text><text x="145" y="1215" class="box-sub">agenda no Kubernetes</text></g>
  <g transform="translate(1435,1165)"><rect width="290" height="70" rx="8" class="orange"/><text x="145" y="1193" class="box-title">Worker de análise</text><text x="145" y="1215" class="box-sub">Deployment + KEDA ou HPA</text></g>
  <rect x="1185" y="1165" width="255" height="70" rx="8" class="blue"/><text x="1312" y="1192" class="box-title">ServiceAccounts com IRSA</text><text x="1312" y="1215" class="box-sub">uma role IAM por workload</text>

  <!-- Managed data services -->
  <rect x="1970" y="405" width="505" height="935" rx="8" class="managed"/>
  <text x="1995" y="436" class="section">Dados, mensageria e observabilidade</text>
  <g transform="translate(2010,470)"><rect width="190" height="90" rx="8" class="orange"/><rect x="15" y="17" width="43" height="43" rx="5" fill="#ea580c"/><text x="36" y="45" class="icon">ECR</text><text x="125" y="42" class="box-title">Amazon ECR</text><text x="125" y="63" class="box-sub">imagem por digest</text></g>
  <g transform="translate(2240,470)"><rect width="190" height="90" rx="8" class="pink"/><rect x="15" y="17" width="43" height="43" rx="5" fill="#db2777"/><text x="36" y="45" class="icon">DDB</text><text x="125" y="42" class="box-title">DynamoDB</text><text x="125" y="63" class="box-sub">operacional e Golden Set</text></g>
  <g transform="translate(2010,640)"><rect width="190" height="90" rx="8" class="pink"/><rect x="15" y="17" width="43" height="43" rx="5" fill="#db2777"/><text x="36" y="45" class="icon">SQS</text><text x="125" y="42" class="box-title">Amazon SQS</text><text x="125" y="63" class="box-sub">fila de análise</text></g>
  <g transform="translate(2240,640)"><rect width="190" height="90" rx="8" class="pink"/><rect x="15" y="17" width="43" height="43" rx="5" fill="#db2777"/><text x="36" y="45" class="icon">DLQ</text><text x="125" y="42" class="box-title">DLQ</text><text x="125" y="63" class="box-sub">falhas após tentativas</text></g>
  <g transform="translate(2010,810)"><rect width="190" height="90" rx="8" class="green"/><rect x="15" y="17" width="43" height="43" rx="5" fill="#16a34a"/><text x="36" y="45" class="icon">S3</text><text x="125" y="42" class="box-title">Amazon S3</text><text x="125" y="63" class="box-sub">histórico e logs</text></g>
  <g transform="translate(2240,810)"><rect width="190" height="90" rx="8" class="blue"/><rect x="15" y="17" width="43" height="43" rx="5" fill="#2563eb"/><text x="36" y="45" class="icon">CW</text><text x="125" y="42" class="box-title">CloudWatch</text><text x="125" y="63" class="box-sub">logs, métricas e alarmes</text></g>
  <rect x="2010" y="980" width="420" height="84" rx="8" class="gray"/><text x="2220" y="1014" class="box-title">VPC endpoints de gateway</text><text x="2220" y="1038" class="box-sub">acesso privado a S3 e DynamoDB</text>
  <rect x="2010" y="1100" width="420" height="84" rx="8" class="gray"/><text x="2220" y="1134" class="box-title">Terraform e kubectl</text><text x="2220" y="1158" class="box-sub">infraestrutura e manifests versionados</text>

  <!-- Runtime flow lines -->
  <path d="M155 310 H390" class="flow"/><text x="265" y="292" class="label">HTTPS</text>
  <path d="M540 276 H590" class="flow"/><text x="552" y="258" class="label">/api, /auth</text>
  <path d="M740 276 H860 V525 H1030" class="flow"/><text x="790" y="258" class="label">HTTP privado</text>
  <path d="M1298 637 V835" class="flow"/><text x="1320" y="735" class="label">rota Ingress</text>
  <path d="M1275 905 V930" class="flow"/>
  <path d="M1275 992 V1008 H1020 V1025" class="flow"/>
  <path d="M1275 992 V1008 H1580 V1025" class="flow"/>
  <path d="M1110 870 H1030 V637" class="controller"/>
  <text x="890" y="785" class="label" fill="#6d28d9">controle do ALB</text>

  <!-- Identity, images and data paths -->
  <path d="M168 611 H2240" class="identity"/><text x="460" y="595" class="label" fill="#2563eb">federação</text>
  <path d="M2240 356 V930 H1422" class="identity"/><text x="2260" y="800" class="label" fill="#2563eb">autenticação</text>
  <path d="M2105 560 V1005 H1020 V1025" class="control"/><path d="M2105 1005 H1580 V1025" class="control"/><path d="M2105 1005 V1165 H1020" class="control"/><path d="M2105 1005 V1165 H1580" class="control"/>
  <text x="1860" y="990" class="label">imagem por digest</text>
  <path d="M1165 1085 H1900 V515 H2240" class="data"/><path d="M1725 1085 H1940 V540 H2240" class="data"/><text x="1820" y="500" class="label" fill="#047857">le e grava</text>
  <path d="M1165 1115 H1910 V685 H2010" class="async"/><text x="1770" y="666" class="label" fill="#c026d3">publica análise</text>
  <path d="M2200 685 H1435" class="async"/><text x="1810" y="705" class="label" fill="#c026d3">consome</text>
  <path d="M1165 1200 H280 V1150 H168" class="data"/><text x="430" y="1178" class="label" fill="#047857">coleta janela</text>
  <path d="M1165 1200 H1900 V855 H2010" class="data"/><text x="1775" y="835" class="label" fill="#047857">histórico</text>
  <path d="M1165 1135 H1870 V855 H2240" class="observe"/><path d="M1725 1135 H2240 V855" class="observe"/><path d="M1165 1235 H1940 V855 H2240" class="observe"/>
  <text x="1860" y="1260" class="label" fill="#c2410c">logs e métricas</text>
  <path d="M2200 685 H2240" class="async"/><text x="2205" y="668" class="label" fill="#c026d3">falha</text>
  <path d="M2220 1184 V1245 H1312 V1235" class="control"/><text x="1540" y="1230" class="label">release</text>
  <path d="M2220 1184 V370 H2210" class="control"/>

  <!-- Legend -->
  <text x="340" y="1440" class="section">Fluxos</text>
  <path d="M340 1470 H410" class="flow"/><text x="425" y="1476" class="legend">requisição</text>
  <path d="M560 1470 H630" class="identity"/><text x="645" y="1476" class="legend">identidade</text>
  <path d="M770 1470 H840" class="data"/><text x="855" y="1476" class="legend">dados</text>
  <path d="M965 1470 H1035" class="async"/><text x="1050" y="1476" class="legend">assíncrono</text>
  <path d="M1190 1470 H1260" class="observe"/><text x="1275" y="1476" class="legend">observabilidade</text>
  <path d="M1470 1470 H1540" class="control"/><text x="1555" y="1476" class="legend">deploy ou controle</text>
  <text x="340" y="1515" class="small">Arquitetura de implantação com EKS Fargate: requer provisionamento e validação antes de entrar em operação.</text>
</svg>
