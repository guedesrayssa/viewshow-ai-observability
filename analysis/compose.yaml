services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
    environment:
      MYSQL_DATABASE: argus
      MYSQL_USER: argus
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?configure MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?configure MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3307:3306"
    volumes:
      - argus_mysql_data:/var/lib/mysql
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  argus_mysql_data:
