# Pilha de observabilidade local do View Show (Grafana LGTM).
#
#   docker compose -f docker-compose.observability.yml up -d
#   docker compose -f docker-compose.observability.yml down          # mantém os dados
#   docker compose -f docker-compose.observability.yml down -v       # apaga os dados
#
# Portas publicadas no host:
#   3002  Grafana (interface web; 3000 é a API e 3001 é o frontend)
#   9090  Prometheus (interface web e API de consulta)
#   3100  Loki (API de ingestão e consulta de logs)
#   3200  Tempo (API de consulta de traces, usada pelo Grafana)
#   4317  Tempo (recepção OTLP via gRPC)
#   4318  Tempo (recepção OTLP via HTTP)
#
# Os data sources são provisionados automaticamente a partir de
# apps/observability/grafana/provisioning/datasources/datasources.yml.

name: view-show-observability

services:
  grafana:
    image: grafana/grafana:13.2.1
    container_name: vs-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      # Provisionamento declarativo: o Grafana lê estes diretórios na subida.
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      # Sem telemetria para a Grafana Labs em ambiente de desenvolvimento.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./apps/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - observability
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: vs-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      # Recebe as métricas derivadas de traces que o Tempo envia por remote write.
      - --web.enable-remote-write-receiver
    volumes:
      - ./apps/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - observability
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  loki:
    image: grafana/loki:3.7.7
    container_name: vs-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./apps/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - observability
    # Sem healthcheck: a imagem do Loki é distroless e não traz shell nem cliente
    # HTTP para sondar /ready. Verifique com: curl http://localhost:3100/ready

  tempo:
    image: grafana/tempo:3.0.3
    container_name: vs-tempo
    restart: unless-stopped
    ports:
      - "${TEMPO_HTTP_PORT:-3200}:3200"
      - "${TEMPO_OTLP_GRPC_PORT:-4317}:4317"
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./apps/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - observability
    # Sem healthcheck: a imagem do Tempo é distroless e não traz shell nem cliente
    # HTTP para sondar /ready. Verifique com: curl http://localhost:3200/ready

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  tempo-data:

networks:
  observability:
    name: view-show-observability
