stages:
  - validate
  - container
  - deploy

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes: &backend_changes
        - apps/backend/api/**/*
        - scripts/ci/**/*
        - scripts/sync-aws-gitlab-credentials.sh
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *backend_changes
    - when: never

default:
  interruptible: true

variables:
  AWS_ACCOUNT_ID: "248880318395"
  AWS_DEFAULT_REGION: "us-east-1"
  ECR_REPOSITORY: "monitoracao-api"
  ECS_CLUSTER: "data-ingestion-cluster"
  ECS_SERVICE: "monitoracao-api-service"
  ECS_TASK_FAMILY: "monitoracao-api-task"
  ECS_CONTAINER_NAME: "monitoracao-api-container"
  ALB_NAME: "data-ingestion-alb"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "/certs/client"
  DOCKER_DRIVER: "overlay2"

validate_backend:
  stage: validate
  image: node:22.22.0-bookworm-slim
  cache:
    key:
      files:
        - apps/backend/api/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd apps/backend/api
  script:
    - node --version
    - npm --version
    - npm ci
    - npm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes: *backend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *backend_changes

build_backend_image:
  stage: container
  image: docker:27.4.1-cli
  services:
    - name: docker:27.4.1-dind
      alias: docker
  needs:
    - validate_backend
  before_script:
    - apk add --no-cache aws-cli bash curl jq
    - docker version
    - aws --version
    - docker buildx create --name ci-builder --driver docker-container --use
    - docker buildx inspect --bootstrap
  script:
    - |
      set -eu
      set -o pipefail

      registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      image_uri="${registry}/${ECR_REPOSITORY}:${CI_COMMIT_SHA}"
      cache_uri="${registry}/${ECR_REPOSITORY}:buildcache"

      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        docker buildx build \
          --platform linux/amd64 \
          --load \
          --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
          --tag "$image_uri" \
          apps/backend/api
      else
        actual_account="$(aws sts get-caller-identity --query Account --output text)"
        test "$actual_account" = "$AWS_ACCOUNT_ID"
        aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
          | docker login --username AWS --password-stdin "$registry"

        describe_error="$(mktemp)"
        if aws ecr describe-images \
          --region "$AWS_DEFAULT_REGION" \
          --repository-name "$ECR_REPOSITORY" \
          --image-ids "imageTag=$CI_COMMIT_SHA" >/dev/null 2>"$describe_error"; then
          rm -f "$describe_error"
          docker pull "$image_uri"
          image_revision="$(docker image inspect "$image_uri" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [ "$image_revision" != "$CI_COMMIT_SHA" ]; then
            echo "existing ECR tag has unexpected source revision: $image_revision" >&2
            exit 1
          fi
        else
          describe_status=$?
          if grep -Fq 'ImageNotFoundException' "$describe_error"; then
            rm -f "$describe_error"
            docker buildx build \
              --platform linux/amd64 \
              --load \
              --cache-from "type=registry,ref=$cache_uri" \
              --cache-to "type=registry,ref=$cache_uri,mode=max,image-manifest=true,oci-mediatypes=true" \
              --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
              --tag "$image_uri" \
              apps/backend/api
            docker push "$image_uri"
          else
            cat "$describe_error" >&2 || :
            rm -f "$describe_error"
            exit "$describe_status"
          fi
        fi
      fi

      bash scripts/ci/smoke-container.sh "$image_uri"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes: *backend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *backend_changes

deploy_backend_ecs:
  stage: deploy
  image: alpine:3.22.1
  interruptible: false
  resource_group: monitoracao-api-service
  needs:
    - build_backend_image
  before_script:
    - apk add --no-cache aws-cli bash curl jq
    - aws --version
    - bash --version | head -1
  script:
    - bash scripts/ci/deploy-ecs.sh
  environment:
    name: aws-lab
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *backend_changes
