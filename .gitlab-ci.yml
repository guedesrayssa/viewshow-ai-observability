# Pipeline de integração e entrega contínua do grupo 05.
#
# O mesmo arquivo coordena o painel em `apps/frontend` (AWS Amplify) e a API em
# `apps/backend/api` (Amazon ECS). As regras por job mantêm cada fluxo isolado:
# mudanças exclusivas de um app não gastam os runners do outro.

stages:
  - validar
  - construir
  - publicar

.mudou-backend: &backend_changes
  - apps/backend/api/**/*
  - apps/backend/contracts/**/*
  - scripts/ci/publish-backend-image.sh
  - scripts/ci/smoke-container.sh
  - scripts/ci/deploy-ecs.sh
  - scripts/sync-aws-gitlab-credentials.sh
  - .gitlab-ci.yml

.mudou-backend-mutacao: &backend_mutation_changes
  - apps/backend/api/src/**/*
  - apps/backend/api/contracts/**/*
  - apps/backend/api/scripts/**/*
  - apps/backend/api/package.json
  - apps/backend/api/package-lock.json
  - apps/backend/api/tsconfig*.json
  - apps/backend/api/Dockerfile
  - apps/backend/api/.dockerignore

.mudou-frontend: &mudou-frontend
  - apps/frontend/**/*
  - .gitlab-ci.yml

.mudou-iac: &iac_changes
  - apps/fullstack/**/*
  - .gitlab-ci.yml

.mudou-ingestion: &ingestion_changes
  - apps/backend/ingestion-data/**/*
  - apps/backend/contracts/**/*
  - scripts/ci/publish-ingestion-image.sh
  - scripts/ci/ingestion-container-smoke.py
  - scripts/ci/smoke-ingestion-container.sh
  - .gitlab-ci.yml

.mudou-python-observability: &python_observability_changes
  - apps/backend/agentic/**/*
  - .gitlab-ci.yml

workflow:
  auto_cancel:
    on_new_commit: conservative
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

validate_fullstack_iac:
  stage: validar
  image:
    name: hashicorp/terraform:1.15.9@sha256:fd5debae63188975d6febc6aa5bd1a982a588f55e4a4ddb7de28be923f250456
    entrypoint: [""]
  script:
    - terraform -chdir=apps/fullstack fmt -check -recursive
    - terraform -chdir=apps/fullstack init -backend=false -input=false
    - terraform -chdir=apps/fullstack validate
    - mkdir -p "$CI_PROJECT_DIR/reports"
    - terraform -chdir=apps/fullstack test -test-directory=tests -junit-xml="$CI_PROJECT_DIR/reports/terraform.xml"
  artifacts:
    when: always
    reports:
      junit: reports/terraform.xml
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes: *iac_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *iac_changes

validate_observability_iac:
  stage: validar
  image: docker:27.4.1-cli@sha256:af0bcc63244e5110ac6499e4a9160a67101bf61abda35c2503ffc40038e8ee0a
  script:
    - docker compose -f apps/fullstack/docker-compose.observability.yml config --quiet
    - AWS_REGION=us-east-1 GRAFANA_ADMIN_PASSWORD=ci-placeholder docker compose -f apps/fullstack/observability/aws/docker-compose.yml config --quiet
    - RENDER_AWS_ACCOUNT_ID=ci-account-id RENDER_AWS_REGION=us-east-1 RENDER_GRAFANA_PASSWORD=ci-placeholder sh apps/fullstack/observability/aws/validate-user-data.sh /tmp/view-show-user-data.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes: *iac_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *iac_changes

variables:
  AWS_DEFAULT_REGION: "us-east-1"
  ECR_REPOSITORY: "view-show-api"
  ECS_CLUSTER: "view-show-cluster"
  ECS_SERVICE: "view-show-api-service"
  ECS_TASK_FAMILY: "view-show-api-task"
  ECS_CONTAINER_NAME: "view-show-api"
  ALB_NAME: "view-show-alb"
  AMPLIFY_APP_NAME: "view-show-painel"
  AMPLIFY_BRANCH: "producao"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: "overlay2"

validate_python_observability:
  stage: validar
  image: python:3.13.15-slim-bookworm@sha256:ed86c82274b3c69b52fb5820f358f0bd7df0b603332063cb5c6e32bd220c3e6e
  script:
    - python --version
    - python -m pip install --disable-pip-version-check --no-cache-dir ruff==0.16.6 -e apps/backend/ingestion-data -e 'apps/backend/agentic[training]'
    - ruff format --check apps/backend/ingestion-data/src apps/backend/ingestion-data/tests apps/backend/agentic/src apps/backend/agentic/tests
    - ruff check apps/backend/ingestion-data/src apps/backend/ingestion-data/tests apps/backend/agentic/src apps/backend/agentic/tests
    - python -m unittest discover -s apps/backend/ingestion-data/tests -v
    - python -m unittest discover -s apps/backend/agentic/tests -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes: *python_observability_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *python_observability_changes

validate_backend:
  stage: validar
  image: node:22.22.0-bookworm-slim@sha256:dd9d21971ec4395903fa6143c2b9267d048ae01ca6d3ea96f16cb30df6187d94
  services:
    - name: amazon/dynamodb-local:2.6.1@sha256:1856c05cc66a0e49dc1099e483ad2851477eeebe2135250ac11a1d1227db54b1
      alias: dynamodb
  variables:
    AWS_ACCESS_KEY_ID: "local"
    AWS_SECRET_ACCESS_KEY: "local"
    AWS_REGION: "us-east-1"
    DYNAMODB_ENDPOINT: "http://dynamodb:8000"
  cache:
    key:
      files:
        - apps/backend/api/package-lock.json
    paths:
      - .npm/
    policy: pull-push
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends jq=1.6-2.1+deb12u2
    - rm -rf /var/lib/apt/lists/*
    - cd apps/backend/api
  script:
    - node --version
    - npm --version
    - npm ci --prefer-offline --no-audit --fund=false
    - npm test
    - npm run test:ci-policy
    - npm run test:e2e
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes: *backend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *backend_changes

validate_ingestion:
  stage: validar
  image: python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
  before_script:
    - cd apps/backend/ingestion-data
    - python --version
    - python -m pip install --no-cache-dir --require-hashes -r requirements-dev.txt
    - python -m pip install --no-deps --no-build-isolation --editable .
  script:
    - mkdir -p "$CI_PROJECT_DIR/reports"
    - python -m ruff check .
    - python -m ruff format --check .
    - python -m mypy --strict --explicit-package-bases bootstrap adapters application contracts domain ports scripts
    - python -m pytest -m "not mysql and not aws" --junitxml="$CI_PROJECT_DIR/reports/ingestion.xml"
  artifacts:
    when: always
    reports:
      junit: reports/ingestion.xml
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes: *ingestion_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *ingestion_changes

validate_ingestion_mysql:
  stage: validar
  image: python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
  services:
    - name: mysql:8.4@sha256:902368b688a8aba1d9de3f59110e4b3cb1a5ea76d370c1c29fa64f724a110cad
      alias: mysql
  variables:
    MYSQL_ROOT_PASSWORD: root-test-only
    MYSQL_DATABASE: argus
    MYSQL_USER: ingestion
    MYSQL_PASSWORD: ingestion-test-only
    MYSQL_TEST_HOST: mysql
    MYSQL_TEST_PORT: "3306"
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends default-mysql-client=1.1.0
    - rm -rf /var/lib/apt/lists/*
    - cd apps/backend/ingestion-data
    - python -m pip install --no-cache-dir --require-hashes -r requirements-dev.txt
    - until mysqladmin ping --host=mysql --user=root --password="$MYSQL_ROOT_PASSWORD" --silent; do sleep 1; done
    - mysql --host=mysql --user=root --password="$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" < contracts/argus/v2/db_schema.sql
    - mysql --host=mysql --user=root --password="$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" < tests/fixtures/argus_v2_minimal.sql
  script:
    - mkdir -p "$CI_PROJECT_DIR/reports"
    - python -m pytest -m mysql tests/integration --junitxml="$CI_PROJECT_DIR/reports/ingestion-mysql.xml"
  artifacts:
    when: always
    reports:
      junit: reports/ingestion-mysql.xml
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes: *ingestion_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *ingestion_changes

validate_ingestion_container:
  stage: construir
  image: docker:27.4.1-cli@sha256:af0bcc63244e5110ac6499e4a9160a67101bf61abda35c2503ffc40038e8ee0a
  tags:
    - inteli-gitlab-runner-prd
  services:
    - name: docker:27.4.1-dind@sha256:3c8fb358b82767a38189e54a89a2ba8d71109f0a17efa87fd009ef8283c46df6
      alias: docker
  needs:
    - validate_ingestion
  before_script:
    - apk add --no-cache bash=5.2.37-r0
    - docker version
    - docker buildx create --name ci-builder --driver docker-container --driver-opt image=moby/buildkit:v0.18.2@sha256:86c0ad9d1137c186e9d455912167df20e530bdf7f7c19de802e892bb8ca16552 --use
    - docker buildx inspect --bootstrap
  script:
    - |
      set -eu
      set -o pipefail
      image_uri="view-show-ingestion-ci:${CI_COMMIT_SHA}"
      docker buildx build --platform linux/amd64 --load --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" --tag "$image_uri" apps/backend/ingestion-data
      bash scripts/ci/smoke-ingestion-container.sh "$image_uri"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes: *ingestion_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *ingestion_changes

publish_ingestion_image:
  stage: construir
  image: docker:27.4.1-cli@sha256:af0bcc63244e5110ac6499e4a9160a67101bf61abda35c2503ffc40038e8ee0a
  tags:
    - inteli-gitlab-runner-prd
  services:
    - name: docker:27.4.1-dind@sha256:3c8fb358b82767a38189e54a89a2ba8d71109f0a17efa87fd009ef8283c46df6
      alias: docker
  variables:
    ECR_REPOSITORY: "view-show-ingestion"
  needs:
    - job: validate_ingestion
      artifacts: false
    - job: validate_ingestion_mysql
      artifacts: false
    - job: validate_ingestion_container
      artifacts: false
  dependencies: []
  before_script:
    - apk add --no-cache aws-cli=2.22.10-r0 bash=5.2.37-r0 git=2.47.3-r0 jq=1.7.1-r0
    - docker version
    - aws --version
    - docker buildx create --name ci-builder --driver docker-container --driver-opt image=moby/buildkit:v0.18.2@sha256:86c0ad9d1137c186e9d455912167df20e530bdf7f7c19de802e892bb8ca16552 --use
    - docker buildx inspect --bootstrap
  script:
    - bash scripts/ci/publish-ingestion-image.sh
    - . ingestion-image.env
    - bash scripts/ci/smoke-ingestion-container.sh "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPOSITORY}@${INGESTION_IMAGE_DIGEST}"
  artifacts:
    paths:
      - ingestion-image.env
    reports:
      dotenv: ingestion-image.env
    expire_in: 7 days
  environment:
    name: aws-lab
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *ingestion_changes

validate_backend_container:
  stage: construir
  image: docker:27.4.1-cli@sha256:af0bcc63244e5110ac6499e4a9160a67101bf61abda35c2503ffc40038e8ee0a
  tags:
    - inteli-gitlab-runner-prd
  services:
    - name: docker:27.4.1-dind@sha256:3c8fb358b82767a38189e54a89a2ba8d71109f0a17efa87fd009ef8283c46df6
      alias: docker
  needs:
    - validate_backend
  before_script:
    - apk add --no-cache bash=5.2.37-r0 jq=1.7.1-r0
    - docker version
    - docker buildx create --name ci-builder --driver docker-container --driver-opt image=moby/buildkit:v0.18.2@sha256:86c0ad9d1137c186e9d455912167df20e530bdf7f7c19de802e892bb8ca16552 --use
    - docker buildx inspect --bootstrap
  script:
    - |
      set -eu
      set -o pipefail
      image_uri="view-show-api-ci:${CI_COMMIT_SHA}"
      docker buildx build \
        --platform linux/amd64 \
        --load \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --tag "$image_uri" \
        apps/backend/api
      bash scripts/ci/smoke-container.sh "$image_uri"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes: *backend_changes

publish_backend_image:
  stage: construir
  image: docker:27.4.1-cli@sha256:af0bcc63244e5110ac6499e4a9160a67101bf61abda35c2503ffc40038e8ee0a
  tags:
    - inteli-gitlab-runner-prd
  services:
    - name: docker:27.4.1-dind@sha256:3c8fb358b82767a38189e54a89a2ba8d71109f0a17efa87fd009ef8283c46df6
      alias: docker
  needs:
    - validate_backend
  before_script:
    - apk add --no-cache aws-cli=2.22.10-r0 bash=5.2.37-r0 git=2.47.3-r0 jq=1.7.1-r0
    - docker version
    - aws --version
    - docker buildx create --name ci-builder --driver docker-container --driver-opt image=moby/buildkit:v0.18.2@sha256:86c0ad9d1137c186e9d455912167df20e530bdf7f7c19de802e892bb8ca16552 --use
    - docker buildx inspect --bootstrap
  script:
    - bash scripts/ci/publish-backend-image.sh
    - . backend-image.env
    - bash scripts/ci/smoke-container.sh "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPOSITORY}@${BACKEND_IMAGE_DIGEST}"
  artifacts:
    paths:
      - backend-image.env
    reports:
      dotenv: backend-image.env
    expire_in: 7 days
  environment:
    name: aws-lab
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *backend_mutation_changes

deploy_backend_ecs:
  stage: publicar
  image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
  tags:
    - inteli-gitlab-runner-prd
  interruptible: false
  resource_group: view-show-api-service
  needs:
    - job: publish_backend_image
      artifacts: true
  before_script:
    - apk add --no-cache aws-cli=2.27.25-r0 bash=5.2.37-r0 curl=8.14.1-r3 git=2.49.1-r0 jq=1.8.1-r0
    - aws --version
    - bash --version | head -1
  script:
    - bash scripts/ci/deploy-ecs.sh
  environment:
    name: aws-lab
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *backend_mutation_changes

# O Amplify Hosting não se conecta diretamente a este GitLab auto-hospedado.
# Por isso o CI compila o frontend e envia o artefato pela API de deployment
# manual da AWS.

.node:
  image: node:22-alpine
  before_script:
    - cd apps/frontend
    - npm ci --prefer-offline --no-audit --fund=false
  cache:
    key:
      files:
        - apps/frontend/package-lock.json
    paths:
      - apps/frontend/node_modules/
    policy: pull

# ---------------------------------------------------------------- validar ----

lint:
  extends: .node
  stage: validar
  script:
    - npm run lint
  cache:
    key:
      files:
        - apps/frontend/package-lock.json
    paths:
      - apps/frontend/node_modules/
    policy: pull-push
  rules:
    - changes: *mudou-frontend

tipos:
  extends: .node
  stage: validar
  script:
    - npm run typecheck
  rules:
    - changes: *mudou-frontend

# Os testes usam jsdom e dublês de leitura (`vi.fn`), não a aplicação
# compilada: rodam em `validar`, ao lado de lint e tipos, sem depender do
# build. `npm test` é `vitest run`, que sai diferente de zero se algum caso
# quebrar — e aí o pipeline falha.
testes-frontend:
  extends: .node
  stage: validar
  script:
    - npm test
  rules:
    - changes: *mudou-frontend

# -------------------------------------------------------------- construir ----

# O endereço da API entra no bundle na compilação, não na publicação: qualquer
# `NEXT_PUBLIC_*` vira texto literal dentro do JavaScript gerado. É por isso que
# configurar essa variável no console do Amplify não teria efeito nenhum, e por
# isso que staging e produção precisam de builds separados.
.construir:
  extends: .node
  stage: construir
  script:
    - npm run build
    - test -f out/index.html
  artifacts:
    paths:
      - apps/frontend/out/
    expire_in: 1 week

construir:staging:
  extends: .construir
  environment:
    name: staging
    action: prepare
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: *mudou-frontend

construir:producao:
  extends: .construir
  environment:
    name: producao
    action: prepare
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *mudou-frontend

# Nos merge requests o build roda só para provar que compila. O artefato não
# serve para publicar nada, então expira rápido.
construir:verificacao:
  extends: .construir
  artifacts:
    paths:
      - apps/frontend/out/
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *mudou-frontend

# ---------------------------------------------------------------- publicar ----

.publicar:
  image:
    name: amazon/aws-cli:2
    # A imagem oficial já entra em `aws` como entrypoint, o que impediria o
    # GitLab de rodar o shell do job.
    entrypoint: [""]
  stage: publicar
  before_script:
    - dnf install --quiet --assumeyes zip
  script:
    - cd apps/frontend
    - ./deploy/deploy-amplify.sh out

publicar:staging:
  extends: .publicar
  needs: ["construir:staging"]
  resource_group: view-show-amplify-producao
  environment:
    name: aws-lab
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: *mudou-frontend

# Produção fica manual de propósito. As credenciais do laboratório da AWS
# Academy expiram a cada sessão, então um deploy automático em `main` falharia
# na maior parte das vezes por motivo nenhum relacionado ao código.
publicar:producao:
  extends: .publicar
  needs: ["construir:producao"]
  resource_group: view-show-amplify-producao
  environment:
    name: aws-lab
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *mudou-frontend
      when: manual
  allow_failure: false
