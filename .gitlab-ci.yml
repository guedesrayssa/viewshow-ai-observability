# Pipeline de integração e entrega contínua do grupo 05.
#
# Hoje cobre apenas o painel em `apps/frontend`. O backend em `apps/basica`
# continua sendo publicado pelo roteiro manual de `artefatos/deploy-aws.md`; os
# estágios abaixo já ficam nomeados de forma genérica para receber os jobs dele
# sem reorganizar o arquivo.
#
# Por que o build acontece aqui e não no Amplify: o Amplify Hosting só conecta
# em GitHub, Bitbucket, GitLab.com e CodeCommit. Este repositório vive em um
# GitLab auto-hospedado, então não há webhook nem build do lado da AWS. O CI
# compila e entrega o resultado pronto pela API de deployment manual.

stages:
  - validar
  - construir
  - publicar

# Commits que só tocam o backend ou a documentação não têm por que gastar um
# runner compilando o frontend.
.mudou-frontend: &mudou-frontend
  - apps/frontend/**/*
  - .gitlab-ci.yml

# Sem isto, subir um branch com merge request aberto dispara dois pipelines
# idênticos: um do branch e um do MR.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

.node:
  image: node:22-alpine
  before_script:
    - cd apps/frontend
    - npm ci --prefer-offline --no-audit --fund=false
  cache:
    key:
      files:
        - apps/frontend/package-lock.json
    paths:
      - apps/frontend/node_modules/
    policy: pull

# ---------------------------------------------------------------- validar ----

lint:
  extends: .node
  stage: validar
  script:
    - npm run lint
  cache:
    key:
      files:
        - apps/frontend/package-lock.json
    paths:
      - apps/frontend/node_modules/
    policy: pull-push
  rules:
    - changes: *mudou-frontend

tipos:
  extends: .node
  stage: validar
  script:
    - npx tsc --noEmit
  rules:
    - changes: *mudou-frontend

# -------------------------------------------------------------- construir ----

# O endereço da API entra no bundle na compilação, não na publicação: qualquer
# `NEXT_PUBLIC_*` vira texto literal dentro do JavaScript gerado. É por isso que
# configurar essa variável no console do Amplify não teria efeito nenhum, e por
# isso que staging e produção precisam de builds separados.
.construir:
  extends: .node
  stage: construir
  script:
    - npm run build
    - test -f out/index.html
  artifacts:
    paths:
      - apps/frontend/out/
    expire_in: 1 week

construir:staging:
  extends: .construir
  environment:
    name: staging
    action: prepare
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: *mudou-frontend

construir:producao:
  extends: .construir
  environment:
    name: producao
    action: prepare
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *mudou-frontend

# Nos merge requests o build roda só para provar que compila. O artefato não
# serve para publicar nada, então expira rápido.
construir:verificacao:
  extends: .construir
  artifacts:
    paths:
      - apps/frontend/out/
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *mudou-frontend

# ---------------------------------------------------------------- publicar ----

.publicar:
  image:
    name: amazon/aws-cli:2
    # A imagem oficial já entra em `aws` como entrypoint, o que impediria o
    # GitLab de rodar o shell do job.
    entrypoint: [""]
  stage: publicar
  before_script:
    - dnf install --quiet --assumeyes zip
  script:
    - cd apps/frontend
    - ./deploy/deploy-amplify.sh "$AMPLIFY_APP_ID" "$AMPLIFY_BRANCH" out

publicar:staging:
  extends: .publicar
  needs: ["construir:staging"]
  variables:
    AMPLIFY_BRANCH: develop
  environment:
    name: staging
    url: https://develop.$AMPLIFY_DEFAULT_DOMAIN
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: *mudou-frontend

# Produção fica manual de propósito. As credenciais do laboratório da AWS
# Academy expiram a cada sessão, então um deploy automático em `main` falharia
# na maior parte das vezes por motivo nenhum relacionado ao código.
publicar:producao:
  extends: .publicar
  needs: ["construir:producao"]
  variables:
    AMPLIFY_BRANCH: main
  environment:
    name: producao
    url: https://main.$AMPLIFY_DEFAULT_DOMAIN
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *mudou-frontend
      when: manual
  allow_failure: false
