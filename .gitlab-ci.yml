# Pipeline de integração e entrega contínua do grupo 05.
#
# O mesmo arquivo coordena o painel em `apps/frontend` (AWS Amplify) e a API em
# `apps/backend/api` (Amazon ECS). As regras por job mantêm cada fluxo isolado:
# mudanças exclusivas de um app não gastam os runners do outro.

stages:
  - validar
  - construir
  - publicar

.mudou-backend: &backend_changes
  - apps/backend/**/*
  - scripts/ci/**/*
  - scripts/sync-aws-gitlab-credentials.sh
  - .gitlab-ci.yml

.mudou-frontend: &mudou-frontend
  - apps/frontend/**/*
  - .gitlab-ci.yml

.mudou-iac: &iac_changes
  - apps/fullstack/**/*
  - .gitlab-ci.yml

workflow:
  auto_cancel:
    on_new_commit: conservative
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

validate_fullstack_iac:
  stage: validar
  image:
    name: hashicorp/terraform:1.15.9@sha256:fd5debae63188975d6febc6aa5bd1a982a588f55e4a4ddb7de28be923f250456
    entrypoint: [""]
  script:
    - terraform -chdir=apps/fullstack fmt -check -recursive
    - terraform -chdir=apps/fullstack init -backend=false -input=false
    - terraform -chdir=apps/fullstack validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes: *iac_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *iac_changes

validate_observability_iac:
  stage: validar
  image: docker:27.4.1-cli@sha256:af0bcc63244e5110ac6499e4a9160a67101bf61abda35c2503ffc40038e8ee0a
  script:
    - docker compose -f apps/fullstack/docker-compose.observability.yml config --quiet
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes: *iac_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *iac_changes

variables:
  AWS_ACCOUNT_ID: "248880318395"
  AWS_DEFAULT_REGION: "us-east-1"
  ECR_REPOSITORY: "monitoracao-api"
  ECS_CLUSTER: "data-ingestion-cluster"
  ECS_SERVICE: "monitoracao-api-service"
  ECS_TASK_FAMILY: "monitoracao-api-task"
  ECS_CONTAINER_NAME: "monitoracao-api-container"
  ALB_NAME: "data-ingestion-alb"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: "overlay2"

validate_backend:
  stage: validar
  image: node:22.22.0-bookworm-slim@sha256:dd9d21971ec4395903fa6143c2b9267d048ae01ca6d3ea96f16cb30df6187d94
  services:
    - name: amazon/dynamodb-local:2.6.1@sha256:1856c05cc66a0e49dc1099e483ad2851477eeebe2135250ac11a1d1227db54b1
      alias: dynamodb
  variables:
    AWS_ACCESS_KEY_ID: "local"
    AWS_SECRET_ACCESS_KEY: "local"
    AWS_REGION: "us-east-1"
    DYNAMODB_ENDPOINT: "http://dynamodb:8000"
  cache:
    key:
      files:
        - apps/backend/api/package-lock.json
    paths:
      - .npm/
    policy: pull-push
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends jq=1.6-2.1+deb12u2
    - rm -rf /var/lib/apt/lists/*
    - cd apps/backend/api
  script:
    - node --version
    - npm --version
    - npm ci --prefer-offline --no-audit --fund=false
    - npm test
    - npm run test:ci-policy
    - npm run test:e2e
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes: *backend_changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *backend_changes

validate_backend_container:
  stage: construir
  image: docker:27.4.1-cli@sha256:af0bcc63244e5110ac6499e4a9160a67101bf61abda35c2503ffc40038e8ee0a
  tags:
    - inteli-gitlab-runner-prd
  services:
    - name: docker:27.4.1-dind@sha256:3c8fb358b82767a38189e54a89a2ba8d71109f0a17efa87fd009ef8283c46df6
      alias: docker
  needs:
    - validate_backend
  before_script:
    - apk add --no-cache bash=5.2.37-r0 jq=1.7.1-r0
    - docker version
    - docker buildx create --name ci-builder --driver docker-container --driver-opt image=moby/buildkit:v0.18.2@sha256:86c0ad9d1137c186e9d455912167df20e530bdf7f7c19de802e892bb8ca16552 --use
    - docker buildx inspect --bootstrap
  script:
    - |
      set -eu
      set -o pipefail
      image_uri="monitoracao-api-ci:${CI_COMMIT_SHA}"
      docker buildx build \
        --platform linux/amd64 \
        --load \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --tag "$image_uri" \
        apps/backend/api
      bash scripts/ci/smoke-container.sh "$image_uri"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes: *backend_changes

publish_backend_image:
  stage: construir
  image: docker:27.4.1-cli@sha256:af0bcc63244e5110ac6499e4a9160a67101bf61abda35c2503ffc40038e8ee0a
  tags:
    - inteli-gitlab-runner-prd
  services:
    - name: docker:27.4.1-dind@sha256:3c8fb358b82767a38189e54a89a2ba8d71109f0a17efa87fd009ef8283c46df6
      alias: docker
  needs:
    - validate_backend
  before_script:
    - apk add --no-cache aws-cli=2.22.10-r0 bash=5.2.37-r0 git=2.47.3-r0 jq=1.7.1-r0
    - docker version
    - aws --version
    - docker buildx create --name ci-builder --driver docker-container --driver-opt image=moby/buildkit:v0.18.2@sha256:86c0ad9d1137c186e9d455912167df20e530bdf7f7c19de802e892bb8ca16552 --use
    - docker buildx inspect --bootstrap
  script:
    - bash scripts/ci/publish-backend-image.sh
    - . backend-image.env
    - bash scripts/ci/smoke-container.sh "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPOSITORY}@${BACKEND_IMAGE_DIGEST}"
  artifacts:
    paths:
      - backend-image.env
    reports:
      dotenv: backend-image.env
    expire_in: 7 days
  environment:
    name: aws-lab
    action: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *backend_changes

deploy_backend_ecs:
  stage: publicar
  image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
  tags:
    - inteli-gitlab-runner-prd
  interruptible: false
  resource_group: monitoracao-api-service
  needs:
    - job: publish_backend_image
      artifacts: true
  before_script:
    - apk add --no-cache aws-cli=2.27.25-r0 bash=5.2.37-r0 curl=8.14.1-r3 git=2.49.1-r0 jq=1.8.1-r0
    - aws --version
    - bash --version | head -1
  script:
    - bash scripts/ci/deploy-ecs.sh
  environment:
    name: aws-lab
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *backend_changes

# O Amplify Hosting não se conecta diretamente a este GitLab auto-hospedado.
# Por isso o CI compila o frontend e envia o artefato pela API de deployment
# manual da AWS.

.node:
  image: node:22-alpine
  before_script:
    - cd apps/frontend
    - npm ci --prefer-offline --no-audit --fund=false
  cache:
    key:
      files:
        - apps/frontend/package-lock.json
    paths:
      - apps/frontend/node_modules/
    policy: pull

# ---------------------------------------------------------------- validar ----

lint:
  extends: .node
  stage: validar
  script:
    - npm run lint
  cache:
    key:
      files:
        - apps/frontend/package-lock.json
    paths:
      - apps/frontend/node_modules/
    policy: pull-push
  rules:
    - changes: *mudou-frontend

tipos:
  extends: .node
  stage: validar
  script:
    - npm run typecheck
  rules:
    - changes: *mudou-frontend

# Os testes usam jsdom e dublês de leitura (`vi.fn`), não a aplicação
# compilada: rodam em `validar`, ao lado de lint e tipos, sem depender do
# build. `npm test` é `vitest run`, que sai diferente de zero se algum caso
# quebrar — e aí o pipeline falha.
testes-frontend:
  extends: .node
  stage: validar
  script:
    - npm test
  rules:
    - changes: *mudou-frontend

# -------------------------------------------------------------- construir ----

# O endereço da API entra no bundle na compilação, não na publicação: qualquer
# `NEXT_PUBLIC_*` vira texto literal dentro do JavaScript gerado. É por isso que
# configurar essa variável no console do Amplify não teria efeito nenhum, e por
# isso que staging e produção precisam de builds separados.
.construir:
  extends: .node
  stage: construir
  script:
    - npm run build
    - test -f out/index.html
  artifacts:
    paths:
      - apps/frontend/out/
    expire_in: 1 week

construir:staging:
  extends: .construir
  environment:
    name: staging
    action: prepare
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: *mudou-frontend

construir:producao:
  extends: .construir
  environment:
    name: producao
    action: prepare
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *mudou-frontend

# Nos merge requests o build roda só para provar que compila. O artefato não
# serve para publicar nada, então expira rápido.
construir:verificacao:
  extends: .construir
  artifacts:
    paths:
      - apps/frontend/out/
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *mudou-frontend

# ---------------------------------------------------------------- publicar ----

.publicar:
  image:
    name: amazon/aws-cli:2
    # A imagem oficial já entra em `aws` como entrypoint, o que impediria o
    # GitLab de rodar o shell do job.
    entrypoint: [""]
  stage: publicar
  before_script:
    - dnf install --quiet --assumeyes zip
  script:
    - cd apps/frontend
    - ./deploy/deploy-amplify.sh "$AMPLIFY_APP_ID" "$AMPLIFY_BRANCH" out

publicar:staging:
  extends: .publicar
  needs: ["construir:staging"]
  variables:
    AMPLIFY_BRANCH: develop
  environment:
    name: staging
    url: https://develop.$AMPLIFY_DEFAULT_DOMAIN
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: *mudou-frontend

# Produção fica manual de propósito. As credenciais do laboratório da AWS
# Academy expiram a cada sessão, então um deploy automático em `main` falharia
# na maior parte das vezes por motivo nenhum relacionado ao código.
publicar:producao:
  extends: .publicar
  needs: ["construir:producao"]
  variables:
    AMPLIFY_BRANCH: main
  environment:
    name: producao
    url: https://main.$AMPLIFY_DEFAULT_DOMAIN
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *mudou-frontend
      when: manual
  allow_failure: false
