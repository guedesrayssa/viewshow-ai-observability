# Worker de análise: Deployment SEM Service (não tem entrada pública; ele só consome a fila SQS).
#
# No minikube ele fica com 0 réplicas, porque consome a fila e a tabela da AWS e precisa de
# credenciais. Para executá-lo, crie o segredo com as credenciais e escale:
#   kubectl -n view-show create secret generic aws-credentials --from-env-file=<arquivo.env>
#   kubectl -n view-show scale deployment/worker --replicas=1
# A imagem view-show-worker:video é a imagem do Worker com um modelo e um catálogo de DEMONSTRAÇÃO.
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
  namespace: view-show
data:
  AWS_REGION: us-east-1
  LLM_PROVIDER: none
  WORKER_CONCURRENCY: "1"
  OPERATIONAL_TABLE_NAME: view-show-iac-operacional
  ANALYSIS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/168051844667/view-show-ingestion-analysis
  ANALYSIS_DLQ_URL: https://sqs.us-east-1.amazonaws.com/168051844667/view-show-ingestion-analysis-dlq
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: view-show
  labels:
    app: worker
spec:
  replicas: 0
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: view-show-worker:video
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: worker-config
            - secretRef:
                name: aws-credentials
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
