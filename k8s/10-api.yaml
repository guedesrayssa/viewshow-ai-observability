# API: Deployment com 2 réplicas, Service interno e HPA (2 a 4 réplicas por CPU).
#
# Os valores abaixo são de DEMONSTRAÇÃO (minikube). Em um ambiente real, os segredos vêm do
# Secrets Manager e os nomes de bucket/tabela vêm do Terraform (ver apps/kubernetes).
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: view-show
data:
  AWS_REGION: us-east-1
  OPERATIONAL_TABLE_NAME: view-show-operacional
  IMPORT_BUCKET: view-show-demo-bucket
  IMPORT_EXPECTED_BUCKET_OWNER: "123456789012"
  IMPORT_KUBERNETES_NAMESPACE: view-show
  IMPORT_KUBERNETES_TEMPLATE: ingestion-import
  IMPORT_INGESTION_CONTAINER_NAME: ingestion
  KUBERNETES_NAMESPACE: view-show
  INGESTION_CRONJOB_NAME: ingestion-sync
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: view-show
type: Opaque
stringData:
  IMPORT_CURSOR_SECRET: demo-cursor-secret-demo-cursor-secret-0123456789
  AUTH_COOKIE_SECRET: demo-cookie-secret-demo-cookie-secret-0123456789
  CURSOR_SECRET: demo-incidents-cursor-secret-0123456789abcdef
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: view-show
  labels:
    app: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: api
  # Atualização sem indisponibilidade: o pod novo só entra em serviço quando fica Ready, e um pod
  # antigo só sai depois disso. Uma imagem defeituosa nunca derruba a versão que está atendendo.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: view-show-api:demo
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Startup: dá tempo para o Node subir antes das outras sondas começarem.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # Readiness: decide se o pod recebe tráfego do Service.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          # Liveness: reinicia o contêiner se o processo travar.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: view-show
  labels:
    app: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: view-show
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
