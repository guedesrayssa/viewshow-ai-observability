name: view-show-rnf-retro
services:
  replay:
    image: python:3.12.11-slim-bookworm
    user: "10001:10001"
    read_only: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["python", "/repo/apps/backend/api/loadtest/grafana-retroativo/replay.py"]
    volumes: ["../../../../..:/repo:ro"]
    ports: ["127.0.0.1:19092:8080"]
  grafana:
    image: grafana/grafana:13.2.1
    ports: ["127.0.0.1:13003:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: lab
      GF_SECURITY_ADMIN_PASSWORD: local-rnf-only
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: local-rnf-renderer-only
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes: ["./provisioning:/etc/grafana/provisioning:ro"]
  renderer:
    image: grafana/grafana-image-renderer:3.12.9
    environment:
      AUTH_TOKEN: local-rnf-renderer-only
