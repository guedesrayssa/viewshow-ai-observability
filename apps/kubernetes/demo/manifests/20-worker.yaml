# Demonstração LOCAL. Não aplicar no EKS: endpoints e credenciais são sintéticos.
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
  namespace: view-show
data:
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL_DYNAMODB: http://host.docker.internal:18004
  AWS_ENDPOINT_URL_SQS: http://host.docker.internal:19324
  NODE_ENV: test
  ALLOW_UNAPPROVED_MODEL: "true"
  ANALYSIS_MODEL_LOCATION: /demo/model.json
  ANALYSIS_SCOPE_CATALOG_LOCATION: /demo/scopes.json
  LLM_PROVIDER: none
  WORKER_CONCURRENCY: "1"
  OPERATIONAL_TABLE_NAME: view-show-demo
  ANALYSIS_QUEUE_URL: http://host.docker.internal:19324/000000000000/view-show-analysis
  ANALYSIS_DLQ_URL: http://host.docker.internal:19324/000000000000/view-show-analysis-dlq
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: view-show
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: view-show-worker:demo
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: worker-config
            - secretRef:
                name: aws-credentials
                optional: false
          volumeMounts:
            - name: fixtures
              mountPath: /demo
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: fixtures
          configMap:
            name: demo-fixtures
