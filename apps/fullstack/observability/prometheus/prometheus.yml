# Configuração do Prometheus da pilha local de observabilidade do View Show.

global:
  # Intervalo de coleta: a cada 15 segundos o Prometheus consulta cada alvo.
  scrape_interval: 15s
  # Prazo máximo para o alvo responder antes da coleta ser considerada falha.
  scrape_timeout: 10s
  # Frequência de avaliação das regras de alerta e de gravação.
  evaluation_interval: 15s
  external_labels:
    cluster: view-show-local
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Auto-observação: o próprio Prometheus expõe métricas em /metrics.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          component: observabilidade

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          component: observabilidade

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          component: observabilidade

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          component: observabilidade

  - job_name: view-show-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          component: api
