global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: view-show-aws
    environment: aws

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          component: observabilidade

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          component: observabilidade

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          component: observabilidade

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          component: observabilidade

  # A API ainda não expõe /metrics. Quando a instrumentação com prom-client
  # entrar, use service discovery ou um alvo estável interno e habilite o scrape.
