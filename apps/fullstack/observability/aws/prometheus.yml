global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: view-show-aws
    environment: aws

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          component: observabilidade

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          component: observabilidade

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          component: observabilidade

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          component: observabilidade

  - job_name: view-show-api
    metrics_path: /metrics
    static_configs:
      - targets: ["__API_TARGET__"]
        labels:
          component: api
