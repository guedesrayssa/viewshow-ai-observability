[project]
name = "telemetria-backend"
version = "0.1.0"
description = "API de ingestão e análise de telemetria de reprodução"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.1,<4",
    "Flask-Cors>=6,<7",
    "boto3>=1.34,<2",
    "gunicorn>=23,<27",
]

[project.optional-dependencies]
dev = ["moto[dynamodb]>=5,<6", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # ordenação de imports
    "B",   # bugbear (armadilhas comuns)
    "UP",  # sintaxe moderna de Python
    "SIM", # simplificações
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Os testes montam payloads longos propositalmente.
"tests/*" = ["E501"]
